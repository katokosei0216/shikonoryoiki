<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品詳細 | 嗜好の領域</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/detail.css?v=20261113-wrap4">
</head>
<body class="subpage-body">
<header id="siteHeader"></header>
<main class="subpage-main">
  <div class="box-card">
    <div class="detail-grid">
      <!-- 画面左半分 -->
      <div>
        <div class="detail-meta" id="detailMeta">読み込み中...</div>
        <h1 class="detail-title" id="detailTitle">読み込み中...</h1>
        <div class="detail-image-box" id="detailImage"></div>

        <div class="fav-action-bar">
          <button type="button" id="favoriteBtn" class="heart-btn" onclick="toggleFavorite()" aria-pressed="false" disabled>♡ お気に入り</button>
          <span style="font-size:13px;color:var(--muted);">登録数: <strong id="favoriteCount" style="color:var(--gold-light);">取得中...</strong></span>
        </div>

        <div style="border-top:1px solid var(--gold-dark);padding-top:15px;">
          <h3 style="font-size:16px;color:var(--gold-light);margin-top:0;">口コミ・評価</h3>
          <div id="reviewSummary" style="font-size:13px;color:var(--gold-light);margin-bottom:10px;">読み込み中...</div>
          <div class="review-form-box">
            <div class="review-field-label">星評価（必須）</div>
            <div class="star-rating-select" role="group" aria-label="星評価を選択">
              <button type="button" class="star" data-index="1" aria-label="1つ星" aria-pressed="false">★</button>
              <button type="button" class="star" data-index="2" aria-label="2つ星" aria-pressed="false">★</button>
              <button type="button" class="star" data-index="3" aria-label="3つ星" aria-pressed="false">★</button>
              <button type="button" class="star" data-index="4" aria-label="4つ星" aria-pressed="false">★</button>
              <button type="button" class="star" data-index="5" aria-label="5つ星" aria-pressed="false">★</button>
            </div>
            <label class="review-field-label" for="commentTextarea">コメント（必須・1000文字以内）</label>
            <textarea class="form-control" id="commentTextarea" maxlength="1000" rows="4" placeholder="このお酒を飲んだ感想を入力..."></textarea>
            <div class="review-form-footer">
              <span id="commentCounter" class="review-count">0 / 1000文字</span>
              <div class="review-form-actions">
                <button type="button" class="gold-button" id="submitCommentBtn">投稿する</button>
                <button type="button" class="icon-btn" id="deleteReviewBtn" style="display:none;">削除する</button>
              </div>
            </div>
            <p id="reviewFeedback" class="review-feedback" role="status" aria-live="polite"></p>
          </div>

          <div class="review-heading-row">
            <span id="reviewListHeading">みんなの口コミ（この商品の最新5件）</span>
            <div class="review-heading-actions">
              <a class="icon-btn" href="mypage.html#comments">自分の投稿履歴</a>
              <button type="button" class="icon-btn" id="refreshReviewsBtn">更新 ↻</button>
              <button type="button" class="icon-btn" onclick="openModal('detailCommentModal')">拡大 ⤢</button>
            </div>
          </div>
          <p id="reviewListCount" class="review-list-count" aria-live="polite">この商品の口コミを読み込み中...</p>
          <div class="comment-list-mini" id="reviewListMini" style="margin-top:10px;">
            <p class="review-loading">読み込み中...</p>
          </div>
          <button type="button" id="toggleReviewListBtn" class="icon-btn review-show-more" hidden>もっと見る</button>
        </div>
      </div>

      <!-- 画面右半分 -->
      <div>
        <div style="margin-bottom:20px;">
          <h3 style="font-size:14px;color:var(--gold-light);margin-top:0;">商品情報</h3>
          <div id="specList"></div>
        </div>

        <div style="margin-bottom:20px;">
          <h3 style="font-size:14px;color:var(--gold-light);margin-top:0;">タグ</h3>
          <div id="tagList"></div>
        </div>

        <div style="border-top:1px solid var(--gold-dark);padding-top:15px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3 style="font-size:16px;color:var(--gold-light);margin:0;">詳細説明文</h3>
            <button class="icon-btn" onclick="openModal('descModal')">拡大 ⤢</button>
          </div>
          <p id="descText" style="font-size:13px;line-height:1.7;color:#ddd;"></p>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="loginPromptModal">
  <div class="modal-content" style="width:min(400px,100%);text-align:center;">
    <button class="modal-close" onclick="closeModal('loginPromptModal')">×</button>
    <div class="subpage-heading">
      <span></span>
      <h1>ログインが必要</h1>
      <span></span>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:20px;" id="loginPromptText">お気に入り機能を利用するにはログインが必要です。</p>
    <a href="login.html" class="gold-button" style="display:block;">ログイン画面へ</a>
  </div>
</div>

<div class="modal-overlay" id="detailCommentModal">
  <div class="modal-content" style="width:min(800px,100%);">
    <button class="modal-close" onclick="closeModal('detailCommentModal')">×</button>
    <div class="subpage-heading">
      <span></span>
      <h1>口コミ一覧 (拡大)</h1>
      <span></span>
    </div>
    <div style="display:flex;gap:15px;margin-bottom:20px;flex-wrap:wrap;">
      <!-- ④ 拡大モーダルの3か所に id を付ける (1つ目) -->
      <select class="form-control" id="reviewStarFilter" style="width:150px;">
        <option value="">すべての星数</option>
        <option value="5">★5</option>
        <option value="4">★4</option>
        <option value="3">★3</option>
        <option value="2">★2</option>
        <option value="1">★1</option>
      </select>
      <!-- ④ 拡大モーダルの3か所に id を付ける (2つ目) -->
      <input type="text" class="form-control" id="reviewKeyword" style="flex:1;" placeholder="コメント・ユーザー名で検索...">
    </div>
    <!-- ④ 拡大モーダルの3か所に id を付ける (3つ目) -->
    <div id="reviewListModal"><p class="review-loading">読み込み中...</p></div>
  </div>
</div>

<div class="modal-overlay" id="descModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal('descModal')">×</button>
    <div class="subpage-heading">
      <span></span>
      <h1>詳細説明文</h1>
      <span></span>
    </div>
    <p id="descModalText" style="font-size:14px;line-height:1.9;color:#eee;"></p>
  </div>
</div>

<script src="../js/common.js?v=20261113-wrap4"></script>
<script src="../js/detail.js?v=20261113-wrap4"></script>
</body>
</html>
