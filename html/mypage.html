<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ | 嗜好の領域</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/easyanswer.css">
<link rel="stylesheet" href="../css/mypage.css">
</head>
<body class="subpage-body mypage-page">
<header id="siteHeader"></header>
<main class="subpage-main">
  <div class="mypage-grid">
    <!-- 画面左：ユーザー情報変更 -->
    <div class="box-card">
      <div class="card-header-flex">
        <h2 class="card-title">会員情報設定</h2>
      </div>
      <div class="profile-avatar-wrap">
        <div class="avatar-img">ICON</div>
        <button type="button" class="icon-btn">アイコンの変更</button>
      </div>
      <form id="profileForm">
        <div class="form-group">
          <label>ユーザー名</label>
          <input type="text" id="usernameInput" class="form-control" maxlength="50">
        </div>
        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" id="emailInput" class="form-control" maxlength="255">
        </div>

        <!-- 新しいパスワード -->
        <div class="form-group">
          <label>新しいパスワード</label>
          <div class="password-input-wrap">
            <input type="password" id="newPasswordInput" class="form-control" placeholder="変更時のみ入力" autocomplete="new-password">
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('newPasswordInput', this)">👁</button>
          </div>
        </div>

        <!-- 新しいパスワード（確認） -->
        <div class="form-group">
          <label>新しいパスワード（確認）</label>
          <div class="password-input-wrap">
            <input type="password" id="confirmPasswordInput" class="form-control" placeholder="確認のため再入力" autocomplete="new-password">
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('confirmPasswordInput', this)">👁</button>
          </div>
        </div>

        <button type="submit" class="gold-button" style="width:100%;margin-top:10px;">変更を保存</button>
      </form>
    </div>

    <!-- 画面右：お気に入り & コメント -->
    <div style="display:flex;flex-direction:column;gap:20px;">
      <!-- 画面右上：お気に入り -->
      <div class="box-card">
        <div class="card-header-flex">
          <h2 class="card-title">お気に入り一覧</h2>
          <button type="button" class="icon-btn" onclick="openModal('favModal')">拡大 ⤢</button>
        </div>
        <div class="item-list-mini" id="favMini"></div>
      </div>

      <!-- 画面右下：コメント -->
      <div class="box-card">
        <div class="card-header-flex">
          <h2 class="card-title">投稿コメント履歴</h2>
          <button type="button" class="icon-btn" onclick="openModal('commentModal')">拡大 ⤢</button>
        </div>
        <div class="comment-list-mini" id="commentMini"></div>
      </div>
    </div>
  </div>
</main>

<!-- お気に入り拡大モーダル -->
<div class="modal-overlay" id="favModal">
  <div class="modal-content" style="width:min(900px,100%);">
    <button type="button" class="modal-close" onclick="closeModal('favModal')">×</button>
    <div class="subpage-heading">
      <span></span>
      <h1>お気に入り一覧 (拡大)</h1>
      <span></span>
    </div>
    <div class="filter-button-group">
      <button type="button" class="cat-btn cat-whisky"   data-category="whisky">ウイスキー</button>
      <button type="button" class="cat-btn cat-cocktail" data-category="cocktail">カクテル</button>
      <button type="button" class="cat-btn cat-sake"     data-category="sake">日本酒</button>
      <button type="button" class="cat-btn cat-wine"     data-category="wine">ワイン</button>
      <button type="button" class="cat-btn cat-paper"    data-category="cigarette">紙</button>
      <button type="button" class="cat-btn cat-vape"     data-category="vape">電子</button>
    </div>
    <div class="form-group" style="margin-bottom:20px;">
      <input type="text" class="form-control" placeholder="名称検索...">
    </div>
    <div class="answer-grid" id="favList" style="margin-top:0;"></div>
  </div>
</div>

<!-- コメント拡大モーダル -->
<div class="modal-overlay" id="commentModal">
  <div class="modal-content" style="width:min(900px,100%);">
    <button type="button" class="modal-close" onclick="closeModal('commentModal')">×</button>
    <div class="subpage-heading">
      <span></span>
      <h1>投稿コメント履歴 (拡大)</h1>
      <span></span>
    </div>
    <div class="filter-button-group">
      <button type="button" class="cat-btn cat-whisky"   data-category="whisky">ウイスキー</button>
      <button type="button" class="cat-btn cat-cocktail" data-category="cocktail">カクテル</button>
      <button type="button" class="cat-btn cat-sake"     data-category="sake">日本酒</button>
      <button type="button" class="cat-btn cat-wine"     data-category="wine">ワイン</button>
      <button type="button" class="cat-btn cat-paper"    data-category="cigarette">紙</button>
      <button type="button" class="cat-btn cat-vape"     data-category="vape">電子</button>
    </div>
    <div class="form-group" style="margin-bottom:20px;">
      <input type="text" class="form-control" placeholder="名称検索...">
    </div>
    <div id="commentList"></div>
  </div>
</div>

<!-- 既存パスワード確認用モーダル（メール・パスワード変更時用） -->
<div class="modal-overlay" id="currentPasswordModal">
  <div class="modal-content" style="width:min(400px,100%);">
    <button type="button" class="modal-close" onclick="closeModal('currentPasswordModal')">×</button>
    <div class="subpage-heading">
      <span></span>
      <h2>本人確認</h2>
      <span></span>
    </div>
    <p style="font-size:13px;color:#ccc;margin-bottom:15px;">メールアドレスまたはパスワードの変更には現在のパスワードが必要です。</p>
    <div class="form-group">
      <label>現在のパスワード</label>
      <div class="password-input-wrap">
        <input type="password" id="currentPasswordInput" class="form-control" placeholder="現在のパスワードを入力" autocomplete="current-password">
        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('currentPasswordInput', this)">👁</button>
      </div>
    </div>
    <button type="button" class="gold-button" style="width:100%;margin-top:15px;" onclick="verifyAndSubmit()">確認して保存</button>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/mypage.js"></script>
</body>
</html>
