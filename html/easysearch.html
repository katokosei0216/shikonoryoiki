<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易検索 | 嗜好の領域</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/easysearch.css">
<style>
  /* 5択の選択肢を縦並びにして見やすくするスタイル */
  .radio-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .radio-options label {
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body class="subpage-body">
<header id="siteHeader"></header>
<main class="subpage-main">
  <div class="box-card" style="width:min(700px,100%);margin:0 auto;position:relative;padding-bottom:80px;">
    <div class="subpage-heading">
      <span></span>
      <h1>嗜好診断 (10の質問)</h1>
      <span></span>
    </div>
    <div class="question-list">

      <!-- Q1 -->
      <div class="question-item">
        <div class="question-title">Q1. 今のあなたの気分は？</div>
        <div class="radio-options">
          <label><input type="radio" name="q1" value="A" checked> A. 今日は最高！気分がいい</label>
          <label><input type="radio" name="q1" value="B"> B. ちょっと落ち込んでいる</label>
          <label><input type="radio" name="q1" value="C"> C. 疲れている・イライラしている</label>
          <label><input type="radio" name="q1" value="D"> D. 穏やかで落ち着いている</label>
          <label><input type="radio" name="q1" value="E"> E. 退屈で刺激が欲しい</label>
        </div>
      </div>

      <!-- Q2 -->
      <div class="question-item">
        <div class="question-title">Q2. 自分に一つだけプレゼントするなら？</div>
        <div class="radio-options">
          <label><input type="radio" name="q2" value="A" checked> A. 癒やしと安らぎ</label>
          <label><input type="radio" name="q2" value="B"> B. ちょっとした贅沢</label>
          <label><input type="radio" name="q2" value="C"> C. いつもどおりの安定</label>
          <label><input type="radio" name="q2" value="D"> D. 新しい刺激</label>
          <label><input type="radio" name="q2" value="E"> E. 自分へのご褒美</label>
        </div>
      </div>

      <!-- Q3 -->
      <div class="question-item">
        <div class="question-title">Q3. 誰かと過ごすならどんな時間がいい？</div>
        <div class="radio-options">
          <label><input type="radio" name="q3" value="A" checked> A. 友達と</label>
          <label><input type="radio" name="q3" value="B"> B. 大切な人と</label>
          <label><input type="radio" name="q3" value="C"> C. 知らない誰かと</label>
          <label><input type="radio" name="q3" value="D"> D. 仕事仲間と</label>
          <label><input type="radio" name="q3" value="E"> E. 一人で</label>
        </div>
      </div>

      <!-- Q4 -->
      <div class="question-item">
        <div class="question-title">Q4. 聴きたい音楽はどんなもの？</div>
        <div class="radio-options">
          <label><input type="radio" name="q4" value="A" checked> A. 心が落ち着くチル系</label>
          <label><input type="radio" name="q4" value="B"> B. しっとりとしたバラード系</label>
          <label><input type="radio" name="q4" value="C"> C. 気分が上がるポップス系</label>
          <label><input type="radio" name="q4" value="D"> D. ノリの良いロック系</label>
          <label><input type="radio" name="q4" value="E"> E. 音に浸れるジャズ系</label>
        </div>
      </div>

      <!-- Q5 -->
      <div class="question-item">
        <div class="question-title">Q5. おつまみはなに？</div>
        <div class="radio-options">
          <label><input type="radio" name="q5" value="A" checked> A. 塩気のあるもの</label>
          <label><input type="radio" name="q5" value="B"> B. 甘い物</label>
          <label><input type="radio" name="q5" value="C"> C. さっぱりした物</label>
          <label><input type="radio" name="q5" value="D"> D. 考慮しない</label>
          <label><input type="radio" name="q5" value="E"> E. なし</label>
        </div>
      </div>

      <!-- Q6 -->
      <div class="question-item">
        <div class="question-title">Q6. どんな酔い方をしたい？</div>
        <div class="radio-options">
          <label><input type="radio" name="q6" value="A" checked> A. ほとんどシラフ</label>
          <label><input type="radio" name="q6" value="B"> B. ほろ酔いで心地よく</label>
          <label><input type="radio" name="q6" value="C"> C. 気分よく楽しく</label>
          <label><input type="radio" name="q6" value="D"> D. べろべろの泥酔</label>
          <label><input type="radio" name="q6" value="E"> E. オールではくまで</label>
        </div>
      </div>

      <!-- Q7 -->
      <div class="question-item">
        <div class="question-title">Q7. どんな雰囲気に浸りたい？</div>
        <div class="radio-options">
          <label><input type="radio" name="q7" value="A" checked> A. にぎやかにワイワイ</label>
          <label><input type="radio" name="q7" value="B"> B. 華やかな楽しさ</label>
          <label><input type="radio" name="q7" value="C"> C. 落ち着いた心で</label>
          <label><input type="radio" name="q7" value="D"> D. 静かにしっぽり</label>
          <label><input type="radio" name="q7" value="E"> E. 妖艶な怪しさ</label>
        </div>
      </div>

      <!-- Q8 -->
      <div class="question-item">
        <div class="question-title">Q8. 気温は心地いい？</div>
        <div class="radio-options">
          <label><input type="radio" name="q8" value="A" checked> A. 外に出たくない暑さ</label>
          <label><input type="radio" name="q8" value="B"> B. 眠くなる暖かさ</label>
          <label><input type="radio" name="q8" value="C"> C. 心地よい気温</label>
          <label><input type="radio" name="q8" value="D"> D. 川のせせらぎのような涼しさ</label>
          <label><input type="radio" name="q8" value="E"> E. 人肌恋しい寒さ</label>
        </div>
      </div>

      <!-- Q9 (追加) -->
      <div class="question-item">
        <div class="question-title">Q9. 休日の一番の過ごし方は？</div>
        <div class="radio-options">
          <label><input type="radio" name="q9" value="A" checked> A. アクティブに出かける</label>
          <label><input type="radio" name="q9" value="B"> B. 家でゆっくり映画鑑賞</label>
          <label><input type="radio" name="q9" value="C"> C. 趣味に没頭する</label>
          <label><input type="radio" name="q9" value="D"> D. 友人と集まる</label>
          <label><input type="radio" name="q9" value="E"> E. 特に予定を決めずダラダラ</label>
        </div>
      </div>

      <!-- Q10 (追加) -->
      <div class="question-item">
        <div class="question-title">Q10. 今、一番求めているものは？</div>
        <div class="radio-options">
          <label><input type="radio" name="q10" value="A" checked> A. 日常からの解放感</label>
          <label><input type="radio" name="q10" value="B"> B. 心の安らぎ</label>
          <label><input type="radio" name="q10" value="C"> C. 新しい発見や出会い</label>
          <label><input type="radio" name="q10" value="D"> D. 確かな実績や充実感</label>
          <label><input type="radio" name="q10" value="E"> E. 気心の知れた時間</label>
        </div>
      </div>

    </div>
    <div style="position:absolute;bottom:25px;right:30px;">
      <a href="easyanswer.html" id="showResult" class="gold-button">診断結果を見る →</a>
    </div>
  </div>
</main>
<script src="../js/common.js"></script>
<script src="../js/easysearch.js"></script>
</body>
</html>
