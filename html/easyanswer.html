<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>診断結果 | 嗜好の領域</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="easyanswer.css">
</head>
<body class="subpage-body">
<header id="siteHeader"></header>
<main class="subpage-main">
  <div class="box-card" style="width:min(900px,100%);margin:0 auto;">
    <div class="subpage-heading">
      <span></span>
      <h1>おすすめの10選</h1>
      <span></span>
    </div>
    <p style="text-align:center;color:var(--muted);font-size:13px;">あなたに最適な提案です。クリックで詳細へ移動します。</p>
    <div class="answer-grid">
      <script>
        for(let i=1; i<=10; i++){
          document.write(`
            <a href="detail.html" class="answer-card">
              <span style="font-size:11px;color:var(--gold);">RECOMMEND #${i}</span>
              <strong style="font-size:16px;color:var(--cream);">提案銘柄名 #${i}</strong>
              <small style="color:var(--muted);">クリックして詳細を見る</small>
            </a>
          `);
        }
      </script>
    </div>
  </div>
</main>
<script src="common.js"></script>
<script src="easyanswer.js"></script>
</body>
</html>
