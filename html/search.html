<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詳細検索 | 嗜好の領域</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/search.css">
</head>
<body class="subpage-body">
<header id="siteHeader"></header>
<main class="subpage-main">

  <!-- 絞り込みパネル -->
  <div class="search-panel box-card">
    <form id="searchForm" onsubmit="return false;">
      
      <!-- 上部: 選んだ種別 + 商品名検索バー -->
      <div class="search-header-bar">
        <div class="category-badge" id="selectedCategoryBadge">◆ ウイスキー</div>
        <div class="keyword-search-wrap">
          <input type="text" class="form-control" name="keyword" placeholder="商品名・銘柄名で検索..." id="keywordInput">
        </div>
      </div>

      <div class="filter-grid">
        <!-- 左列: 基本仕様 (国/メーカー/価格/年代/度数) -->
        <div id="basicInfoSection">
          <div class="filter-section-title">基本情報</div>
          
          <!-- 製造国 / 都道府県 -->
          <div class="form-group" id="countryFilterGroup">
            <label id="countryLabel">製造国</label>
            <input type="text" class="form-control" name="country" list="countryDatalist" id="countryInput" placeholder="入力または選択...">
            <datalist id="countryDatalist">
              <option value="日本">
              <option value="スコットランド">
              <option value="アイルランド">
              <option value="アメリカ">
              <option value="カナダ">
            </datalist>
          </div>

          <!-- メーカー -->
          <div class="form-group" id="makerFilterGroup">
            <label>メーカー</label>
            <input type="text" class="form-control" name="maker" list="makerDatalist" placeholder="入力または選択...">
            <datalist id="makerDatalist">
              <option value="サントリー">
              <option value="ニッカウイスキー">
              <option value="キリン">
              <option value="獺祭（旭酒造）">
              <option value="バカルディ">
            </datalist>
          </div>

          <!-- 値段 下限〜上限 -->
          <div class="form-group" id="priceFilterGroup">
            <label>値段</label>
            <div class="range-group">
              <select class="form-control" name="price_min">
                <option value="">下限なし</option>
                <option value="5000">5,000円</option>
                <option value="10000">10,000円</option>
                <option value="20000">20,000円</option>
                <option value="30000">30,000円</option>
                <option value="40000">40,000円</option>
                <option value="50000">50,000円</option>
                <option value="100000">100,000円</option>
                <option value="200000">200,000円</option>
              </select>
              <span style="color:var(--muted)">〜</span>
              <select class="form-control" name="price_max">
                <option value="">上限なし</option>
                <option value="5000">5,000円</option>
                <option value="10000">10,000円</option>
                <option value="20000">20,000円</option>
                <option value="30000">30,000円</option>
                <option value="40000">40,000円</option>
                <option value="50000">50,000円</option>
                <option value="100000">100,000円</option>
                <option value="200000">200,000円</option>
              </select>
            </div>
          </div>

          <!-- 年代 -->
          <div class="form-group" id="ageFilterGroup">
            <label>年代</label>
            <div class="range-group">
              <select class="form-control" name="age_min">
                <option value="">下限なし</option>
                <option value="5">5年</option>
                <option value="10">10年</option>
                <option value="15">15年</option>
                <option value="20">20年</option>
                <option value="25">25年</option>
                <option value="30">30年</option>
                <option value="35">35年</option>
                <option value="40">40年</option>
              </select>
              <span style="color:var(--muted)">〜</span>
              <select class="form-control" name="age_max">
                <option value="">上限なし</option>
                <option value="5">5年</option>
                <option value="10">10年</option>
                <option value="15">15年</option>
                <option value="20">20年</option>
                <option value="25">25年</option>
                <option value="30">30年</option>
                <option value="35">35年</option>
                <option value="40">40年</option>
              </select>
            </div>
          </div>

          <!-- 度数 -->
          <div class="form-group" id="abvFilterGroup">
            <label>度数</label>
            <div class="range-group">
              <select class="form-control" name="abv_min">
                <option value="">下限なし</option>
                <option value="3">3%</option>
                <option value="5">5%</option>
                <option value="10">10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
                <option value="25">25%</option>
                <option value="30">30%</option>
                <option value="35">35%</option>
                <option value="40">40%</option>
                <option value="45">45%</option>
                <option value="50">50%</option>
              </select>
              <span style="color:var(--muted)">〜</span>
              <select class="form-control" name="abv_max">
                <option value="">上限なし</option>
                <option value="3">3%</option>
                <option value="5">5%</option>
                <option value="10">10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
                <option value="25">25%</option>
                <option value="30">30%</option>
                <option value="35">35%</option>
                <option value="40">40%</option>
                <option value="45">45%</option>
                <option value="50">50%</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 中列: 5段階評価指標 -->
        <div>
          <div class="filter-section-title">風味・テイスト（5段階）</div>

          <!-- 香り: 1無〜5強 -->
          <div class="form-group">
            <label>香り（1: 無し 〜 5: 強い）</label>
            <div class="rating-options">
              <div class="rating-btn"><input type="radio" name="aroma" id="aroma1" value="1"><label for="aroma1">1</label></div>
              <div class="rating-btn"><input type="radio" name="aroma" id="aroma2" value="2"><label for="aroma2">2</label></div>
              <div class="rating-btn"><input type="radio" name="aroma" id="aroma3" value="3"><label for="aroma3">3</label></div>
              <div class="rating-btn"><input type="radio" name="aroma" id="aroma4" value="4"><label for="aroma4">4</label></div>
              <div class="rating-btn"><input type="radio" name="aroma" id="aroma5" value="5"><label for="aroma5">5</label></div>
            </div>
          </div>

          <!-- 味: 1甘〜5苦 -->
          <div class="form-group">
            <label>味（1: 甘い 〜 5: 苦い）</label>
            <div class="rating-options">
              <div class="rating-btn"><input type="radio" name="taste" id="taste1" value="1"><label for="taste1">1</label></div>
              <div class="rating-btn"><input type="radio" name="taste" id="taste2" value="2"><label for="taste2">2</label></div>
              <div class="rating-btn"><input type="radio" name="taste" id="taste3" value="3"><label for="taste3">3</label></div>
              <div class="rating-btn"><input type="radio" name="taste" id="taste4" value="4"><label for="taste4">4</label></div>
              <div class="rating-btn"><input type="radio" name="taste" id="taste5" value="5"><label for="taste5">5</label></div>
            </div>
          </div>

          <!-- 酸味: 1無〜5酸 -->
          <div class="form-group">
            <label>酸味（1: 無し 〜 5: 酸っぱい）</label>
            <div class="rating-options">
              <div class="rating-btn"><input type="radio" name="acidity" id="acidity1" value="1"><label for="acidity1">1</label></div>
              <div class="rating-btn"><input type="radio" name="acidity" id="acidity2" value="2"><label for="acidity2">2</label></div>
              <div class="rating-btn"><input type="radio" name="acidity" id="acidity3" value="3"><label for="acidity3">3</label></div>
              <div class="rating-btn"><input type="radio" name="acidity" id="acidity4" value="4"><label for="acidity4">4</label></div>
              <div class="rating-btn"><input type="radio" name="acidity" id="acidity5" value="5"><label for="acidity5">5</label></div>
            </div>
          </div>

          <!-- 濃厚さ: 1無〜5濃 -->
          <div class="form-group">
            <label>濃厚さ（1: 無し 〜 5: 濃厚）</label>
            <div class="rating-options">
              <div class="rating-btn"><input type="radio" name="richness" id="richness1" value="1"><label for="richness1">1</label></div>
              <div class="rating-btn"><input type="radio" name="richness" id="richness2" value="2"><label for="richness2">2</label></div>
              <div class="rating-btn"><input type="radio" name="richness" id="richness3" value="3"><label for="richness3">3</label></div>
              <div class="rating-btn"><input type="radio" name="richness" id="richness4" value="4"><label for="richness4">4</label></div>
              <div class="rating-btn"><input type="radio" name="richness" id="richness5" value="5"><label for="richness5">5</label></div>
            </div>
          </div>
        </div>

        <!-- 右列: 種別固有の絞り込みチェックボックス -->
        <div>
          <div class="filter-section-title">カテゴリー固有条件</div>

          <!-- ウイスキー固有 -->
          <div id="whiskySpecific" style="display:none;">
            <div class="checkbox-group">
              <label class="checkbox-item"><input type="checkbox" name="whisky_type[]" value="smoke"> スモーク</label>
              <label class="checkbox-item"><input type="checkbox" name="whisky_type[]" value="grain"> グレーン</label>
              <label class="checkbox-item"><input type="checkbox" name="whisky_type[]" value="malt"> モルト</label>
              <label class="checkbox-item"><input type="checkbox" name="whisky_type[]" value="blended"> ブレンデッド</label>
            </div>

            <!-- おすすめの飲み方 (折りたたみ) ※valueは drink_styles.style_name と一致させる -->
            <details class="filter-accordion" style="margin-top:10px;">
              <summary>おすすめの飲み方</summary>
              <div class="accordion-content">
                <div class="checkbox-group">
                  <label class="checkbox-item"><input type="checkbox" name="whisky_way[]" value="ソーダ割(ハイボール)"> ソーダ割(ハイボール)</label>
                  <label class="checkbox-item"><input type="checkbox" name="whisky_way[]" value="水割り"> 水割り</label>
                  <label class="checkbox-item"><input type="checkbox" name="whisky_way[]" value="常温水割(トワイスアップ)"> 常温水割(トワイスアップ)</label>
                  <label class="checkbox-item"><input type="checkbox" name="whisky_way[]" value="お湯割り(ホットウイスキー)"> お湯割り(ホットウイスキー)</label>
                  <label class="checkbox-item"><input type="checkbox" name="whisky_way[]" value="ストレート"> ストレート</label>
                  <label class="checkbox-item"><input type="checkbox" name="whisky_way[]" value="ロック"> ロック</label>
                  <label class="checkbox-item"><input type="checkbox" name="whisky_way[]" value="ハーフロック"> ハーフロック</label>
                  <label class="checkbox-item"><input type="checkbox" name="whisky_way[]" value="ミスト"> ミスト</label>
                  <label class="checkbox-item"><input type="checkbox" name="whisky_way[]" value="ウイスキーフロート"> ウイスキーフロート</label>
                </div>
              </div>
            </details>
          </div>

          <!-- 日本酒固有 -->
          <div id="sakeSpecific" style="display:none;">
            <div class="checkbox-group">
              <label class="checkbox-item"><input type="checkbox" name="sake_type[]" value="easy"> 呑みやすい</label>
              <label class="checkbox-item"><input type="checkbox" name="sake_type[]" value="dry"> 辛口</label>
              <label class="checkbox-item"><input type="checkbox" name="sake_type[]" value="sweet"> 甘口</label>
            </div>

            <!-- おすすめの飲み方 (折りたたみ) -->
            <details class="filter-accordion" style="margin-top:10px;">
              <summary>おすすめの飲み方</summary>
              <div class="accordion-content">
                <div class="checkbox-group">
                  <label class="checkbox-item"><input type="checkbox" name="sake_way[]" value="ソーダ割り"> ソーダ割り</label>
                  <label class="checkbox-item"><input type="checkbox" name="sake_way[]" value="冷酒"> 冷酒</label>
                  <label class="checkbox-item"><input type="checkbox" name="sake_way[]" value="冷や"> 冷や</label>
                  <label class="checkbox-item"><input type="checkbox" name="sake_way[]" value="燗酒"> 燗酒</label>
                  <label class="checkbox-item"><input type="checkbox" name="sake_way[]" value="ロック"> ロック</label>
                </div>
              </div>
            </details>
          </div>

          <!-- ワイン固有 -->
          <div id="wineSpecific" style="display:none;">
            <div class="checkbox-group">
              <label class="checkbox-item"><input type="checkbox" name="wine_type[]" value="赤"> 赤</label>
              <label class="checkbox-item"><input type="checkbox" name="wine_type[]" value="白"> 白</label>
              <label class="checkbox-item"><input type="checkbox" name="wine_type[]" value="泡"> スパークリング</label>
              <label class="checkbox-item"><input type="checkbox" name="wine_type[]" value="ロゼ"> ロゼ</label>
            </div>

            <!-- おすすめの飲み方 (折りたたみ) -->
            <details class="filter-accordion" style="margin-top:10px;">
              <summary>おすすめの飲み方</summary>
              <div class="accordion-content">
                <div class="checkbox-group">
                  <label class="checkbox-item"><input type="checkbox" name="wine_way[]" value="ソーダ割(スプリッツァー)"> ソーダ割(スプリッツァー)</label>
                  <label class="checkbox-item"><input type="checkbox" name="wine_way[]" value="ホット"> ホット</label>
                  <label class="checkbox-item"><input type="checkbox" name="wine_way[]" value="オペレーター"> オペレーター</label>
                  <label class="checkbox-item"><input type="checkbox" name="wine_way[]" value="キール"> キール</label>
                  <label class="checkbox-item"><input type="checkbox" name="wine_way[]" value="キティ"> キティ</label>
                  <label class="checkbox-item"><input type="checkbox" name="wine_way[]" value="カリモーチョ"> カリモーチョ</label>
                  <label class="checkbox-item"><input type="checkbox" name="wine_way[]" value="アメリカン・レモネード"> アメリカン・レモネード</label>
                  <label class="checkbox-item"><input type="checkbox" name="wine_way[]" value="サングリア"> サングリア</label>
                </div>
              </div>
            </details>
          </div>

          <!-- カクテル固有 -->
          <div id="cocktailSpecific" style="display:none;">
            <!-- 製法 (折りたたみ) ※valueはPHP側のコードと対応 -->
            <details class="filter-accordion">
              <summary>製法</summary>
              <div class="accordion-content">
                <div class="checkbox-group">
                  <label class="checkbox-item"><input type="checkbox" name="cocktail_method[]" value="shake"> シェイク</label>
                  <label class="checkbox-item"><input type="checkbox" name="cocktail_method[]" value="build"> ビルド</label>
                  <label class="checkbox-item"><input type="checkbox" name="cocktail_method[]" value="smoke"> スモーク</label>
                  <label class="checkbox-item"><input type="checkbox" name="cocktail_method[]" value="short"> ショート</label>
                  <label class="checkbox-item"><input type="checkbox" name="cocktail_method[]" value="long_stir"> ロングステア</label>
                  <label class="checkbox-item"><input type="checkbox" name="cocktail_method[]" value="blend"> ブレンド</label>
                  <label class="checkbox-item"><input type="checkbox" name="cocktail_method[]" value="muddle"> マドル</label>
                  <label class="checkbox-item"><input type="checkbox" name="cocktail_method[]" value="layer"> レイヤー</label>
                  <label class="checkbox-item"><input type="checkbox" name="cocktail_method[]" value="float"> フロート</label>
                </div>
              </div>
            </details>

            <!-- 素材 (折りたたみ) ※valueは fruits.fruit_name / tags.tag_name と一致させる -->
            <details class="filter-accordion" style="margin-top:8px;">
              <summary>素材</summary>
              <div class="accordion-content">
                <div class="checkbox-group">
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="レモン"> レモン</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="ライム"> ライム</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="ピーチ"> ピーチ</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="パイン"> パイン</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="オレンジ"> オレンジ</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="ライチ"> ライチ</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="グレープフルーツ"> グレープフルーツ</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="クランベリー"> クランベリー</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="パッションフルーツ"> パッションフルーツ</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="ココナッツ"> ココナッツ</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="コーヒー"> コーヒー</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="トマト"> トマト</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="ミント"> ミント</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="ジンジャー"> ジンジャー</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="ミルク・クリーム"> ミルク・クリーム</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="卵白"> 卵白</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="蜂蜜"> 蜂蜜</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="りんご"> りんご</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="メロン"> メロン</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="ベリー"> ベリー</label>
                  <label class="checkbox-item"><input type="checkbox" name="material[]" value="茶"> 茶</label>
                </div>
              </div>
            </details>

            <!-- ベース酒 (折りたたみ) ※valueは base_liquors.base_liquor_name と一致 -->
            <details class="filter-accordion" style="margin-top:8px;">
              <summary>ベース酒</summary>
              <div class="accordion-content">
                <div class="checkbox-group">
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="ジン"> ジン</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="ウォッカ"> ウォッカ</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="ラム"> ラム</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="テキーラ"> テキーラ</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="ブランデー"> ブランデー</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="ウィスキー"> ウィスキー</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="ワイン"> ワイン</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="リキュール"> リキュール</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="発泡ワイン"> 発泡ワイン</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="ビール"> ビール</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="カシャッサ"> カシャッサ</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="ピスコ"> ピスコ</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="メスカル"> メスカル</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="シェリー"> シェリー</label>
                  <label class="checkbox-item"><input type="checkbox" name="base[]" value="ベルモット"> ベルモット</label>
                </div>
              </div>
            </details>
          </div>
        </div>
      </div>

      <!-- 下部アクション -->
      <div class="search-actions">
        <button type="button" class="clear-btn" onclick="resetFilters()">条件をクリア</button>
        <button type="submit" class="gold-button">🔍 この条件で検索する</button>
      </div>
    </form>
  </div>

  <!-- 絞り込み結果一覧 -->
  <div class="subpage-heading">
    <span></span>
    <h1>検索結果一覧</h1>
    <span></span>
  </div>
  <div id="resultCount" style="color:var(--muted);text-align:center;margin-bottom:12px;"></div>
  <div class="answer-grid" id="resultGrid"></div>
  <div id="pager" style="display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:24px 0;"></div>

</main>

<script src="../js/common.js"></script>
<script src="../js/search.js"></script>
</body>
</html>
