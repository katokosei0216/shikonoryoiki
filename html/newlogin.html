<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規会員登録 | 嗜好の領域</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="newlogin.css">
</head>
<body class="subpage-body">
<header id="siteHeader"></header>
<main class="subpage-main">
  <div class="box-card newlogin-card">
    <div class="subpage-heading">
      <span></span>
      <h1>新規会員登録</h1>
      <span></span>
    </div>
    <form onsubmit="return false;">
      <div class="form-group">
        <label>ユーザー名</label>
        <input type="text" class="form-control" required placeholder="お名前 / ニックネーム">
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" class="form-control" required placeholder="example@domain.com">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" class="form-control" required>
      </div>
      <button type="submit" class="gold-button" style="width:100%;margin-top:10px;">登録する</button>
    </form>
    <a href="login.html" class="gold-button" style="display:block;text-align:center;margin-top:15px;background:#11120f;">ログイン画面へ戻る</a>
  </div>
</main>
<script src="common.js"></script>
<script src="newlogin.js"></script>
</body>
</html>
