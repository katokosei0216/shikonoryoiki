<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規会員登録 | 嗜好の領域</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/register.css">
</head>
<body class="subpage-body register-page">
<header id="siteHeader"></header>
<main class="subpage-main">
  <div class="box-card newlogin-card">
    <div class="subpage-heading">
      <span></span>
      <h1>新規会員登録</h1>
      <span></span>
    </div>

    <!-- エラーメッセージ表示用エリア（初期状態は非表示） -->
    <p id="errorMessage" style="color: #ff4d4f; text-align: center; margin-bottom: 15px; font-weight: bold; display: none;"></p>

    <!-- 処理を行うPHPファイルへPOST送信 -->
<form action="../php/register.php" method="POST">
      <div class="form-group">
        <label>ユーザー名</label>
        <input type="text" name="user_name" id="regUsername" class="form-control" required placeholder="お名前 / ニックネーム">
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" name="email" id="regEmail" class="form-control" required placeholder="example@domain.com">
      </div>
      
      <!-- パスワード -->
      <div class="form-group">
        <label>パスワード</label>
        <div class="password-input-wrap">
          <input type="password" name="password" id="regPassword" class="form-control" required placeholder="パスワードを入力">
          <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('regPassword', this)">👁</button>
        </div>
      </div>

      <!-- パスワード（確認） -->
      <div class="form-group">
        <label>パスワード（確認）</label>
        <div class="password-input-wrap">
          <input type="password" name="confirm_password" id="regConfirmPassword" class="form-control" required placeholder="確認のため再入力">
          <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('regConfirmPassword', this)">👁</button>
        </div>
      </div>

      <button type="submit" class="gold-button" style="width:100%;margin-top:10px;">登録する</button>
    </form>
    <a href="login.html" class="gold-button" style="display:block;text-align:center;margin-top:15px;background:#11120f;text-decoration:none;">ログイン画面へ戻る</a>
  </div>
</main>
<script src="../js/common.js"></script>
<script src="../js/register.js"></script>
<script>
  // URLのパラメータからエラーメッセージを受け取って表示する処理
  const urlParams = new URLSearchParams(window.location.search);
  const errorMsg = urlParams.get('error');
  if (errorMsg) {
    const errP = document.getElementById('errorMessage');
    errP.textContent = errorMsg;
    errP.style.display = 'block';
  }
</script>
</body>
</html>
